name: Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-foundation

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        # The GitHub-hosted Ubuntu runner includes the Android command-line tools
        # and accepted SDK licenses. sdkmanager fails if installation fails.
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Run unit tests, lint and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        # Runs only after successful validation/build. Never upload the workspace,
        # Gradle home, signing keys, health exports or test/runtime logs.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TrainingHQ-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
